<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Fiddle</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --bg:#ffffff;
    --ink:#1a1a1a;
    --indigo:#2b3a55;
    --rust:#8a4b32;
    --line:#dedad0;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:'Source Serif 4', serif;}
  a{color:inherit;}
  .wrap{max-width:1000px; margin:0 auto; padding:0 32px;}

  header.top{display:flex; justify-content:space-between; align-items:center; padding:22px 0; border-bottom:1px solid var(--ink);}
  .brandmark{display:flex; align-items:center; gap:12px;}
  .brandmark svg{width:30px; height:30px;}
  .brandmark .name{font-family:'Fraunces', serif; font-weight:600; font-size:18px; letter-spacing:0.3px;}
  nav{display:flex; gap:26px; font-family:'IBM Plex Mono', monospace; font-size:12.5px; letter-spacing:1px; text-transform:uppercase;}
  nav a{text-decoration:none; border-bottom:1px solid transparent; padding-bottom:3px;}
  nav a:hover{border-bottom-color:var(--rust); color:var(--rust);}

  .hero{padding:76px 0 56px; text-align:center; border-bottom:1px solid var(--line);}
  .hero svg{width:88px; height:88px; margin-bottom:22px;}
  .hero h1{
    font-family:'Fraunces', serif; font-weight:600; letter-spacing:1px;
    font-size:clamp(36px,6vw,56px); margin:0 0 14px; text-transform:uppercase;
  }
  .hero p{font-size:17px; color:#4a4a4a; margin:0;}

  .sections{
    display:grid; grid-template-columns:repeat(4,1fr); border-bottom:1px solid var(--ink);
  }
  .sections a{
    text-decoration:none; color:var(--ink);
    padding:44px 20px; text-align:center; border-right:1px solid var(--line);
    font-family:'IBM Plex Mono', monospace; font-size:15px; letter-spacing:2px; text-transform:uppercase;
    transition:background 0.15s ease;
  }
  .sections a:last-child{border-right:none;}
  .sections a:hover{background:#faf9f6;}
  .sections a span{display:block; font-family:'Source Serif 4', serif; text-transform:none; letter-spacing:0; font-size:12.5px; color:#8a8a8a; margin-top:8px;}

  footer{padding:34px 0; display:flex; justify-content:space-between; font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:#5c5c5c;}
  footer a{text-decoration:underline;}
</style>
</head>

      <div class="name">The Fiddle</div>
